name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      apply-infra:
        description: 'EXECUTAR TERRAFORM?'
        required: true
        default: false
        type: choice
        options:
          - true
          - false
      sync-image:
        description: 'FAZER PUSH DA IMAGEM PARA ECR?'
        required: true
        default: false
        type: choice
        options:
          - true
          - false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get Version from pom.xml
        id: get-version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build com Maven (sem testes)
        run: mvn clean package -DskipTests

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem Docker (sem push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: |
            validator-api:${{ steps.get-version.outputs.version }}
            validator-api:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      ecr_url: ${{ steps.get-ecr.outputs.ecr_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ACCESS_SECRET_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2

      - name: Terraform Init
        run: |
          cd infra
          terraform init \
            -backend-config="bucket=bucket-terraform-statefile-validator-api"

      - name: Terraform Validate
        run: cd infra && terraform validate

      - name: Terraform Plan
        run: cd infra && terraform plan -out=tfplan.tfout

      - name: Terraform Apply
        id: terraform_apply
        if: github.event.inputs.apply-infra == 'true'
        run: cd infra && terraform apply -auto-approve tfplan.tfout

      - name: Obter URL do repositório ECR
        id: get-ecr
        if: steps.terraform_apply.conclusion == 'success'
        run: |
          cd infra
          ECR_URL=$(terraform output -raw ecr_repository_url)
          echo "ecr_url=$ECR_URL" >> $GITHUB_OUTPUT

