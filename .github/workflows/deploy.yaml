name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      apply-infra:
        description: 'Criar infraestrutura?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.0.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ACCESS_SECRET_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2

      - name: Terraform Init
        run: |
          cd infra
          terraform init \
            -backend-config="bucket=bucket-terraform-statefile-validator-api"

      - name: Terraform Validate
        run: |
          cd infra
          terraform validate

      - name: Terraform Plan
        run: |
          cd infra
          terraform plan -out=tfplan.tfout

      - name: Terraform Apply
        id: terraform-apply
        run: |
          set -e
          cd infra
          terraform apply -auto-approve tfplan.tfout
        if: github.event.inputs.apply-infra == 'true'

      - name: Obter URL do repositório ECR
        if: terraform-apply == 'true'
        id: get-ecr
        run: |
          cd infra
          ECR_URL=$(terraform output -raw ecr_repository_url)
          echo "ECR_REPO=$ECR_URL" >> $GITHUB_ENV
          echo "ECR_REPO=$ECR_URL" >> $GITHUB_OUTPUT

      - name: Login no Amazon ECR
        if: steps.terraform-apply == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag e push da imagem para o ECR
        if: terraform-apply == 'true'
        run: |
          docker tag validator-api:${{ needs.build.outputs.version }} $ECR_REPO:latest
          docker tag validator-api:${{ needs.build.outputs.version }} $ECR_REPO:${{ needs.build.outputs.version }}
          docker push $ECR_REPO:latest
          docker push $ECR_REPO:${{ needs.build.outputs.version }}
